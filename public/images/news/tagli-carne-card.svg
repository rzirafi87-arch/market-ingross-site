<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9EA"/>
      <stop offset="1" stop-color="#FEE2E2"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="42" y="42" width="1196" height="636" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>

  <text x="90" y="118" fill="#0D7A3A" font-size="40" font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="2">
    MARKET INGROSS CONSIGLIA
  </text>

  <text x="90" y="208" fill="#DC2626" font-size="96" font-family="Arial, Helvetica, sans-serif" font-weight="900">
    LA CARNE
  </text>
  <text x="90" y="292" fill="#0D7A3A" font-size="84" font-family="Arial, Helvetica, sans-serif" font-weight="900">
    SPIEGATA SEMPLICE
  </text>

  <text x="90" y="356" fill="#334155" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="600">
    Quali sono i tagli della carne?
  </text>

  <rect x="88" y="402" width="620" height="190" rx="20" fill="#ECFDF3" stroke="#16A34A" stroke-width="3"/>
  <text x="120" y="456" fill="#166534" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="900">Cottura veloce</text>
  <text x="120" y="500" fill="#334155" font-size="30" font-family="Arial, Helvetica, sans-serif">filetto, costata, lombata, fesa</text>
  <text x="120" y="542" fill="#166534" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700">Taglio tenero = pochi minuti</text>

  <rect x="738" y="402" width="454" height="190" rx="20" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>
  <text x="770" y="456" fill="#B91C1C" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="900">Cottura lenta</text>
  <text x="770" y="500" fill="#334155" font-size="30" font-family="Arial, Helvetica, sans-serif">muscolo, reale, spalla</text>
  <text x="770" y="542" fill="#B91C1C" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700">Taglio saporito = tempo</text>

  <rect x="88" y="618" width="1104" height="36" rx="10" fill="#0B3B82"/>
  <text x="106" y="643" fill="#FFFFFF" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700">
